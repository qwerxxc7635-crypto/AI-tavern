[package]
name = "ember-native-bridge"
version.workspace = true
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ember-secure-http = { path = "../secure-http" }
ember-platform-services = { path = "../platform-services" }
regex = "1.12.3"
rusqlite = { version = "0.38.0", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1.21.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.26.0"

[lints]
workspace = true
