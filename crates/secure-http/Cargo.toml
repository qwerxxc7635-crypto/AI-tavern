[package]
name = "ember-secure-http"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1.11.1"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
