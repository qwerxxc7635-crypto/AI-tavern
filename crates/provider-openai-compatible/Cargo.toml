[package]
name = "ember-provider-openai-compatible"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ember-secure-http = { path = "../secure-http" }
ember-secure-secrets = { path = "../secure-secrets" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
time = { version = "0.3.47", features = ["formatting"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
uuid = { version = "1.24.0", features = ["v4"] }

[lints]
workspace = true
