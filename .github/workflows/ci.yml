name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check release metadata synchronization
        run: pnpm release:check

      - name: Check player-facing zh-CN resources
        run: pnpm i18n:check

      - name: Lint TypeScript
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test TypeScript
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Verify current TypeScript and Rust save interoperability
        run: pnpm archive:interop

  windows-release:
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Windows vertical slice evidence
        run: node scripts/run-with-evidence.mjs --output artifacts/evidence/windows-e2e.json -- pnpm test:windows-e2e
      - name: Build NSIS release with evidence
        run: node scripts/run-with-evidence.mjs --output artifacts/evidence/windows-nsis-build.json -- pnpm --dir windows-app tauri build --bundles nsis
      - name: Credential Manager, WebView2, install, launch and uninstall evidence
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter '*-setup.exe' -File
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)." }
          node scripts/run-with-evidence.mjs --output artifacts/evidence/windows-install-gate-command.json -- pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release-gate.ps1 -InstallerPath $installer[0].FullName -EvidenceOutput artifacts/evidence/windows-install-lifecycle.json
      - name: Hash release bundle
        run: node scripts/collect-release-evidence.mjs --root target/release/bundle/nsis --output artifacts/evidence/windows-release-files.json
      - name: Upload Windows release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ember-tavern-windows-release-evidence
          path: |
            target/release/bundle/nsis
            artifacts/evidence
          if-no-files-found: error

  macos-build:
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS app with evidence
        run: node scripts/run-with-evidence.mjs --output artifacts/evidence/macos-app-build.json -- pnpm --dir windows-app tauri build --bundles app
      - name: Keychain, WKWebView, app launch and PlatformPaths evidence
        run: node scripts/run-with-evidence.mjs --output artifacts/evidence/macos-lifecycle-gate-command.json -- node scripts/macos-release-gate.mjs --app 'target/release/bundle/macos/Ember Tavern.app' --output artifacts/evidence/macos-lifecycle.json
      - name: Hash macOS app bundle
        run: node scripts/collect-release-evidence.mjs --root target/release/bundle/macos --output artifacts/evidence/macos-release-files.json
      - name: Upload macOS build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ember-tavern-macos-build-evidence
          path: |
            target/release/bundle/macos
            artifacts/evidence
          if-no-files-found: error
