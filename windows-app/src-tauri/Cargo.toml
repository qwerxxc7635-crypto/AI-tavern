[package]
name = "ember-tavern-windows"
version.workspace = true
edition = "2024"
publish = false

[lib]
name = "ember_tavern_windows_lib"
crate-type = ["rlib"]

[features]
e2e-data-root = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ember-native-bridge = { path = "../../crates/native-bridge" }
ember-platform-services = { path = "../../crates/platform-services" }
ember-provider-openai-compatible = { path = "../../crates/provider-openai-compatible" }
ember-secure-secrets = { path = "../../crates/secure-secrets" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
time = { version = "0.3.47", features = ["formatting"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.21.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.26.0"
tokio = { version = "1.48.0", features = ["macros", "rt"] }

[lints]
workspace = true
