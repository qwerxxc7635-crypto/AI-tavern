[package]
name = "ember-tavern-windows"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ember_tavern_windows_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ember-native-bridge = { path = "../../crates/native-bridge" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2", features = [] }

[lints]
workspace = true
